<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acidito</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0b08;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    canvas {
      flex: none;
      display: block;
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* Panel del editor de niveles */
    #editor-panel {
      flex: none;
      box-sizing: border-box;
      width: 330px;
      height: 98vh;
      overflow-y: auto;
      padding: 12px 14px;
      background: #1a150f;
      border: 2px solid #6e5b3e;
      border-radius: 10px;
      color: #f3e6c8;
      font: 13px "Segoe UI", system-ui, sans-serif;
    }
    #editor-panel[hidden] { display: none; }
    #editor-panel header { display: flex; align-items: center; justify-content: space-between; }
    #editor-panel h1 { margin: 0; font-size: 18px; color: #ffe9b8; }
    #editor-panel h2 { margin: 0 0 6px; font-size: 14px; color: #ffe9b8; }
    #editor-panel h3 { margin: 8px 0 4px; font-size: 11px; font-weight: 600; color: #9c8d70; text-transform: uppercase; letter-spacing: 0.05em; }
    #editor-panel section { padding: 10px 0; border-bottom: 1px solid #3b3022; }
    #editor-panel section:last-child { border-bottom: 0; }
    #editor-panel label { display: block; margin: 4px 0; color: #d9c9a6; }
    #editor-panel .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: end; margin-top: 6px; }
    #editor-panel .row label { margin: 0; }
    #editor-panel input, #editor-panel select, #editor-panel textarea {
      box-sizing: border-box;
      background: #0d0b08;
      color: #f3e6c8;
      border: 1px solid #6e5b3e;
      border-radius: 6px;
      padding: 4px 6px;
      font: inherit;
    }
    #editor-panel label > input:not([type="number"]) { width: 100%; margin-top: 2px; }
    #editor-panel input[type="number"] { width: 58px; }
    #editor-panel select { max-width: 190px; }
    #editor-panel textarea { width: 100%; font: 11px Consolas, monospace; resize: vertical; }
    #editor-panel button {
      background: #2b2419;
      color: #f3e6c8;
      border: 1px solid #6e5b3e;
      border-radius: 6px;
      padding: 5px 9px;
      font: inherit;
      cursor: pointer;
    }
    #editor-panel button:hover:not(:disabled) { border-color: #ffe08a; }
    #editor-panel button:disabled { opacity: 0.4; cursor: default; }
    #editor-panel button.primary { background: #ffe08a; color: #1a150f; font-weight: 700; border-color: #ffe08a; }
    #editor-panel .help { margin: 4px 0; color: #9c8d70; font-size: 12px; }
    #editor-panel .good { margin: 0; color: #9dff8a; }
    #editor-panel .bad { margin: 0; color: #f0a58f; }
    #editor-panel ul { margin: 4px 0; padding-left: 18px; color: #f0a58f; }
    #editor-panel .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    #editor-panel .tile { display: flex; align-items: center; gap: 6px; padding: 3px 6px; text-align: left; font-size: 12px; }
    #editor-panel .tile.on { border-color: #ffe08a; background: #3b3022; }
    #editor-panel .sw {
      flex: none;
      display: inline-grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      font: bold 12px Consolas, monospace;
    }
    #editor-panel .mech { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px; margin-bottom: 6px; border: 1px solid #3b3022; border-radius: 6px; }
    #editor-panel .mech label { margin: 0; }
    #editor-panel .mech input[type="number"] { width: 48px; }
    #editor-panel .mech [data-act="del-mech"] { margin-left: auto; padding: 2px 7px; }

    /* Paneles encima del juego: online y progreso */
    .overlay-panel {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 8, 5, 0.6);
      font: 14px "Segoe UI", system-ui, sans-serif;
      color: #f3e6c8;
    }
    .overlay-panel[hidden], .overlay-panel [hidden] { display: none !important; }
    .overlay-panel .box {
      box-sizing: border-box;
      width: min(420px, calc(100vw - 32px));
      padding: 16px 18px;
      background: #1a150f;
      border: 2px solid #6e5b3e;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .overlay-panel header { display: flex; align-items: center; justify-content: space-between; }
    .overlay-panel h1 { margin: 0; font-size: 20px; color: #ffe9b8; }
    .overlay-panel .help, .overlay-panel .note { color: #9c8d70; margin: 8px 0; }
    .overlay-panel .note { font-size: 12px; }
    .overlay-panel .start { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .overlay-panel .row { display: flex; gap: 8px; }
    .overlay-panel input {
      flex: 1;
      min-width: 0;
      background: #0d0b08;
      color: #ffe9b8;
      border: 1px solid #6e5b3e;
      border-radius: 8px;
      padding: 8px 10px;
      font: bold 18px Consolas, monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .overlay-panel button {
      background: #2b2419;
      color: #f3e6c8;
      border: 1px solid #6e5b3e;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    .overlay-panel button:hover { border-color: #ffe08a; }
    .overlay-panel button.primary { background: #ffe08a; color: #1a150f; font-weight: 700; border-color: #ffe08a; }
    .overlay-panel .code-label { margin: 12px 0 0; color: #d9c9a6; }
    .overlay-panel .code { margin: 4px 0 10px; font: bold 34px Consolas, monospace; letter-spacing: 0.25em; color: #ffe08a; }
    /* Barra de conexión: un tramo por personaje (vacío, conectando o listo) */
    #online-panel .bar { display: flex; gap: 6px; margin: 4px 0 6px; }
    #online-panel .seg {
      position: relative;
      flex: 1;
      height: 34px;
      overflow: hidden;
      background: #0d0b08;
      border: 1px solid #3b3022;
      border-radius: 8px;
    }
    #online-panel .seg i {
      position: absolute;
      inset: 0;
      width: 0;
      background: var(--c);
      transition: width 0.5s ease;
    }
    #online-panel .seg.joining i {
      width: 55%;
      opacity: 0.55;
      background: repeating-linear-gradient(-45deg, var(--c) 0 8px, transparent 8px 16px);
      background-size: 22.6px 22.6px;
      animation: online-stripes 0.8s linear infinite;
    }
    #online-panel .seg.ready i { width: 100%; opacity: 0.85; }
    #online-panel .seg.ready { border-color: var(--c); }
    #online-panel .seg span {
      position: relative;
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #f3e6c8;
      text-shadow: 0 1px 2px #000;
      white-space: nowrap;
    }
    @keyframes online-stripes { to { background-position: 22.6px 0; } }
    #online-panel .countdown { min-height: 0; margin: 8px 0 0; font-size: 20px; font-weight: 700; color: #bfe8a8; text-align: center; }
    #online-panel .countdown:empty, #online-panel .slow:empty { display: none; }
    #online-panel .slow { color: #f0a58f; font-size: 13px; margin: 6px 0; }
    #online-panel .room > button { margin-top: 10px; }
    .overlay-panel .status { min-height: 1.2em; color: #ffe08a; margin: 10px 0 0; }
    .overlay-panel textarea {
      box-sizing: border-box;
      width: 100%;
      resize: none;
      background: #0d0b08;
      color: #ffe08a;
      border: 1px solid #6e5b3e;
      border-radius: 6px;
      padding: 6px 8px;
      font: 13px Consolas, monospace;
      word-break: break-all;
    }
    .overlay-panel .summary { color: #d9c9a6; margin: 8px 0; }
    .overlay-panel .label { color: #d9c9a6; margin: 14px 0 4px; }
    #progress-panel .row { margin-top: 8px; }
    /* Controles táctiles (tactil.js) */
    #touch-pad { position: fixed; inset: 0; pointer-events: none; z-index: 5; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #touch-pad[hidden], #touch-pad [hidden] { display: none !important; }
    #touch-pad button {
      pointer-events: auto;
      touch-action: none;
      font: 700 26px "Segoe UI", system-ui, sans-serif;
      color: #f3e6c8;
      background: rgba(26, 21, 15, 0.55);
      border: 2px solid rgba(255, 233, 184, 0.35);
      border-radius: 50%;
      width: 76px;
      height: 76px;
      -webkit-tap-highlight-color: transparent;
    }
    #touch-pad button.on { background: rgba(255, 224, 138, 0.45); border-color: #ffe08a; }
    #touch-pad .tp-move, #touch-pad .tp-act { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 14px; }
    #touch-pad .tp-move { left: max(14px, env(safe-area-inset-left)); }
    #touch-pad .tp-act { right: max(14px, env(safe-area-inset-right)); align-items: flex-end; }
    #touch-pad .tp-act [data-k="jump"] { width: 92px; height: 92px; border-color: var(--me, #ffe08a); }
    #touch-pad .tp-act [data-k="fire"] { width: 64px; height: 64px; font-size: 22px; }
    #touch-pad .tp-top { position: absolute; top: max(6px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; gap: 8px; align-items: center; }
    #touch-pad .tp-top > button { width: 44px; height: 44px; font-size: 18px; }
    #touch-pad .tp-who { display: flex; gap: 4px; }
    #touch-pad .tp-who button { width: auto; height: 32px; padding: 0 10px; border-radius: 16px; font-size: 13px; border-color: var(--c); color: var(--c); }
    #touch-pad .tp-who button.on { background: var(--c); color: #1a150f; }
    #touch-pad .tp-me { font: 700 13px "Segoe UI", system-ui, sans-serif; text-shadow: 0 1px 2px #000; }
    #touch-rotate { display: none; }
    @media (orientation: portrait) {
      html.touch #touch-rotate {
        display: flex; position: fixed; inset: 0; z-index: 6; align-items: center; justify-content: center;
        background: rgba(10, 8, 5, 0.88); color: #ffe9b8; font: 700 20px "Segoe UI", system-ui, sans-serif;
      }
    }
    html.touch, html.touch body { touch-action: manipulation; overscroll-behavior: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="src/levels.js"></script>
  <script src="src/levels2.js"></script>
  <script src="src/levels3.js"></script>
  <script src="src/editor.js"></script>
  <script src="src/game.js"></script>
  <script src="src/online.js"></script>
  <script src="src/progreso.js"></script>
  <script src="src/tactil.js"></script>
</body>
</html>
